name: Enviar lembretes da escala

on:
  schedule:
    # Verificação frequente; a API só envia dentro da janela curta do horário devido.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: escala-musica-push-reminders
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acionar notificações no horário
        run: |
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --max-time 60 \
            "https://escala-musica-jardim-brasil.pharaujo7.chatgpt.site/api/push/dispatch"
